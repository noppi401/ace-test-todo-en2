<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      color: #333;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    #todoInput {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    #todoInput:focus {
      outline: none;
      border-color: #666;
    }
    #addBtn {
      padding: 8px 16px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    #addBtn:hover {
      background: #555;
    }
    #todoList {
      list-style: none;
      padding: 0;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .todo-title {
      flex: 1;
    }
    .todo-title.completed {
      text-decoration: line-through;
      opacity: 0.5;
    }
    .toggle-btn,
    .delete-btn {
      padding: 4px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      background: #fff;
    }
    .toggle-btn:hover {
      background: #eef;
    }
    .delete-btn:hover {
      background: #fee;
    }
    .empty-msg {
      color: #999;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <h1>ToDo App</h1>
  <div class="add-form">
    <input id="todoInput" type="text" placeholder="Add a new todo...">
    <button id="addBtn">Add Todo</button>
  </div>
  <ul id="todoList"></ul>

  <script>
    const todoList = document.getElementById('todoList');
    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');

    async function loadTodos() {
      try {
        const res = await fetch('/api/todos');
        if (!res.ok) {
          const err = await res.json();
          alert('Error loading todos: ' + err.error);
          return;
        }
        const todos = await res.json();
        renderTodos(todos);
      } catch (e) {
        alert('Network error. Please try again.');
        console.error(e);
      }
    }

    function renderTodos(todos) {
      todoList.innerHTML = '';
      if (todos.length === 0) {
        const msg = document.createElement('p');
        msg.className = 'empty-msg';
        msg.textContent = 'No todos yet. Add one above!';
        todoList.appendChild(msg);
        return;
      }
      todos.forEach(function(todo) {
        const li = document.createElement('li');
        li.className = 'todo-item';

        // Use textContent (never innerHTML) to prevent XSS
        const span = document.createElement('span');
        span.className = 'todo-title' + (todo.completed ? ' completed' : '');
        span.textContent = todo.title;

        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'toggle-btn';
        toggleBtn.textContent = todo.completed ? 'Undo' : 'Done';
        toggleBtn.addEventListener('click', function() {
          toggleTodo(todo.id, todo.completed);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';
        deleteBtn.addEventListener('click', function() {
          deleteTodo(todo.id);
        });

        li.appendChild(span);
        li.appendChild(toggleBtn);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });
    }

    async function addTodo(title) {
      if (!title.trim()) {
        alert('Please enter a todo title.');
        return;
      }
      try {
        const res = await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title })
        });
        if (!res.ok) {
          const err = await res.json();
          alert('Error: ' + err.error);
          return;
        }
        todoInput.value = '';
        await loadTodos();
      } catch (e) {
        alert('Network error. Please try again.');
        console.error(e);
      }
    }

    async function toggleTodo(id, currentCompleted) {
      try {
        const res = await fetch('/api/todos/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: !currentCompleted })
        });
        if (!res.ok) {
          const err = await res.json();
          alert('Error: ' + err.error);
          return;
        }
        await loadTodos();
      } catch (e) {
        alert('Network error. Please try again.');
        console.error(e);
      }
    }

    async function deleteTodo(id) {
      try {
        const res = await fetch('/api/todos/' + id, { method: 'DELETE' });
        if (!res.ok) {
          const err = await res.json();
          alert('Error: ' + err.error);
          return;
        }
        await loadTodos();
      } catch (e) {
        alert('Network error. Please try again.');
        console.error(e);
      }
    }

    addBtn.addEventListener('click', function() {
      addTodo(todoInput.value);
    });

    todoInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTodo(todoInput.value);
      }
    });

    loadTodos();
  </script>
</body>
</html>
